name: MXGP Live Capture

# ────────────────────────────────────────────────────────────
# Déclenchement : UNIQUEMENT via workflow_dispatch (cron-job.org
# appelle l'API GitHub à heure fixe pour lancer ce workflow).
# Le déclenchement "schedule" interne de GitHub a été retiré
# volontairement — le garder en plus de cron-job.org provoquait des
# doubles lancements simultanés (un par schedule, un par cron-job.org).
# ────────────────────────────────────────────────────────────
on:
  workflow_dispatch: {} # déclenché par cron-job.org (et testable manuellement)

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 358 # filet de sécurité — le script s'arrête déjà seul à 5h50

    steps:
      - name: Checkout du site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: capture/package-lock.json

      - name: Installation des dépendances
        working-directory: capture
        run: npm install

      - name: Lancer la capture
        working-directory: capture
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: node capture.js
